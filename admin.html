<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PikminWish 管理後台</title>
  <link rel="stylesheet" href="css/admin.css?v=custom-flower-visible-20260528" />
</head>
<body>
<div class="admin-bg"></div>

  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">PikminWish</p>
        <h1>管理後台</h1>
        <p class="hint">這個頁面只給管理員查看、改狀態與刪除資料。</p>
      </div>
      <div class="admin-actions">
        <span id="adminHeaderAccount" class="account-badge" hidden>未登入</span>
        <a class="ghost-btn" href="index.html">回正式網站</a>
        <button id="adminLoginBtn" class="main-btn" type="button">Google 登入</button>
        <button id="adminLogoutBtn" class="ghost-btn" type="button" hidden>登出</button>
      </div>
    </header>

    <section id="loginPanel" class="glass-card center-card">
      <h2>請先登入管理員 Google 帳號</h2>
      <p>登入後系統會檢查信箱是否在管理員清單內。</p>
      <button id="loginPanelBtn" class="main-btn" type="button">使用 Google 登入</button>
      <p class="small-note">登入後會自動檢查是否為管理員帳號。</p>
    </section>

    <section id="noAccessPanel" class="glass-card center-card danger" hidden>
      <h2>沒有管理權限</h2>
      <p id="noAccessText">這個 Google 帳號不在管理員清單內。</p>
      <a class="main-btn" href="index.html">回正式網站</a>
    </section>

    <section id="adminPanel" hidden>
      <div class="status-row">
        <div class="glass-card stat-card">
          <span>目前登入</span>
          <strong id="adminUserEmail">-</strong>
        </div>
        <div class="glass-card stat-card">
          <span>許願池</span>
          <strong id="wishCount">0</strong>
        </div>
        <div class="glass-card stat-card">
          <span>歷史紀錄</span>
          <strong id="historyCount">0</strong>
        </div>
        <div class="glass-card stat-card">
          <span>自訂花種</span>
          <strong id="customFlowerCount">0</strong>
        </div>
      </div>

      <nav class="tabs" aria-label="管理分類">
        <button class="tab-btn active" data-tab="flowers" type="button">快速新增花種</button>
        <button class="tab-btn" data-tab="wishes" type="button">許願資料</button>
        <button class="tab-btn" data-tab="history" type="button">歷史紀錄</button>
      </nav>

      <section id="flowersTab" class="glass-card data-card" data-tab-panel="flowers">
        <div class="card-head">
          <div>
            <h2>快速新增花種</h2>
            <p>新增後會同步到正式網站的圖鑑與許願花種選單。</p>
          </div>
        </div>

        <form id="quickFlowerForm" class="quick-flower-form">
          <label>
            <span>花種名稱</span>
            <input id="quickFlowerName" class="admin-field" type="text" placeholder="例如：風鈴草" autocomplete="off" required />
          </label>
          <label>
            <span>備註小字（可不填）</span>
            <input id="quickFlowerSubtitle" class="admin-field" type="text" placeholder="例如：6月新花" autocomplete="off" />
          </label>
          <div class="color-checks" aria-label="可用顏色">
            <span>圖鑑顏色</span>
            <label><input type="checkbox" name="quickFlowerColor" value="白" checked /> 白</label>
            <label><input type="checkbox" name="quickFlowerColor" value="黃" /> 黃</label>
            <label><input type="checkbox" name="quickFlowerColor" value="紅" /> 紅</label>
            <label><input type="checkbox" name="quickFlowerColor" value="藍" /> 藍</label>
          </div>
          <label class="inline-check">
            <input id="quickFlowerLocked" type="checkbox" />
            <span>先鎖定，暫時不開放許願</span>
          </label>
          <button class="main-btn" type="submit">新增 / 更新花種</button>
        </form>

        <p class="small-note">提醒：許願單仍會自動隱藏白色；兩色以上會自動出現混色、隨意色。</p>
        <div id="customFlowerList" class="admin-list flower-admin-list"></div>
      </section>

      <section id="wishesTab" class="glass-card data-card" data-tab-panel="wishes" hidden>
        <div class="card-head">
          <div>
            <h2>許願資料</h2>
            <p>可改狀態或刪除不適當的單。</p>
          </div>
          <input id="wishSearch" class="search-input" type="search" placeholder="搜尋花名 / 暱稱 / 狀態" />
        </div>
        <div id="wishList" class="admin-list"></div>
      </section>

      <section id="historyTab" class="glass-card data-card" data-tab-panel="history" hidden>
        <div class="card-head">
          <div>
            <h2>歷史紀錄</h2>
            <p>完成與刪除紀錄會顯示在這裡。</p>
          </div>
          <input id="historySearch" class="search-input" type="search" placeholder="搜尋花名 / 花農 / 許願者" />
        </div>
        <div id="historyList" class="admin-list"></div>
      </section>
    </section>
  </main>

  <script type="module" src="js/admin.js?v=custom-flower-visible-20260528"></script>
</body>
</html>
