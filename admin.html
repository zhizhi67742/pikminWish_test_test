<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PikminWish 管理後台</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-locked">
  <main class="admin-page">
    <section id="adminLoginGate" class="admin-login-gate" aria-label="管理員登入">
      <div class="admin-panel">
        <div class="admin-brand">PikminWish</div>
        <h1>管理後台</h1>

        <div id="adminAccountInfo" class="admin-account-info">
          目前狀態：未登入
        </div>

        <p class="admin-desc">
          請先使用 Google 登入，登入後才能進入管理網站。
        </p>

        <div class="admin-actions">
          <button id="adminGoogleLoginBtn" type="button">使用 Google 登入</button>
          <button id="adminBackHomeBtn" type="button" class="secondary">回正式網站</button>
        </div>
      </div>
    </section>

    <section id="adminContent" class="admin-content">
      <div class="admin-header">
        <div>
          <div class="admin-brand small">PikminWish</div>
          <h1>管理後台</h1>
          <p id="adminUserText">已登入管理員</p>
        </div>
        <a class="home-link" href="index.html">回正式網站</a>
      </div>

      <div class="admin-grid">
        <article class="admin-card">
          <h2>許願單管理</h2>
          <p>這裡可以放刪除、完成、恢復許願單等功能。</p>
        </article>

        <article class="admin-card">
          <h2>歷史紀錄</h2>
          <p>這裡可以查看完成與刪除紀錄。</p>
        </article>

        <article class="admin-card">
          <h2>花朵圖鑑</h2>
          <p>這裡可以放花種與顏色管理。</p>
        </article>
      </div>
    </section>
  </main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
